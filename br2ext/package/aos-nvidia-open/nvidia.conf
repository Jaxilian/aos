# Expose the GPU through DRM/KMS. A compositor talking to /dev/dri needs
# this; without it nvidia-drm registers but does not do modesetting.
options nvidia-drm modeset=1

# nvidia-drm has no PCI alias, so nothing loads it on demand, and without
# it the GPU has no /dev/dri node for GBM, Xwayland's GLX or PRIME. It
# follows nvidia, which udev loads only when an NVIDIA GPU is present --
# unlike a modules-load.d entry, which would fail on every other machine.
softdep nvidia post: nvidia-drm

# nouveau and nvidia both claim every NVIDIA GPU, and whichever udev loads
# first binds it. nouveau without the GSP firmware (which only this
# driver's package carries) leaves a Turing-or-newer GPU dark -- the G14's
# RTX 5070 came up that way. With the open modules in the image, nouveau
# is never the one wanted.
blacklist nouveau
options nouveau modeset=0
