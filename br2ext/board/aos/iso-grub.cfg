serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set default="0"
set timeout="5"

if regexp '^cd[0-9]*$' "${root}"; then
	set aoslive="/dev/sr0"
else
	set aoslive="PARTUUID=__ROOT_PARTUUID__"
fi
set aosargs="aos.core=live aos.live=${aoslive} aos.hash=__HASH__ aos.offset=__OFFSET__ rootwait"

menuentry "AOS (live)" {
	linux /boot/bzImage ${aosargs} loglevel=4 console=ttyS0,115200 console=tty1
	initrd /boot/microcode.img /boot/initramfs.img
}

menuentry "AOS (live, serial console)" {
	linux /boot/bzImage ${aosargs} console=ttyS0,115200
	initrd /boot/microcode.img /boot/initramfs.img
}

menuentry "AOS (live, safe graphics, no GPU driver)" {
	linux /boot/bzImage ${aosargs} nomodeset loglevel=4 console=ttyS0,115200 console=tty1
	initrd /boot/microcode.img /boot/initramfs.img
}

menuentry "AOS (live, force optical /dev/sr0)" {
	linux /boot/bzImage aos.core=live aos.live=/dev/sr0 aos.hash=__HASH__ aos.offset=__OFFSET__ rootwait console=ttyS0,115200 console=tty1
	initrd /boot/microcode.img /boot/initramfs.img
}
