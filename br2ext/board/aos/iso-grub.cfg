# Drive both the screen and a serial line. A foundation image gets installed
# headlessly at least as often as it gets a monitor, and without this the
# boot menu is invisible over serial.
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set default="0"
set timeout="5"

# How the kernel is told to find the medium it is booting from.
#
# This one image is written to optical media and to USB sticks, and the two
# need different answers -- which is why it is decided here, where GRUB
# knows which it booted from, rather than hardcoded:
#
#  - Optical. The kernel does not parse a partition table on a CD, so a
#    PARTUUID cannot resolve: it sees only /dev/sr0, whole and unpartitioned.
#  - USB. There is no /dev/sr0 at all; the stick is a disk. The kernel does
#    read the ISO's GPT there, so the PARTUUID of its first partition names
#    the medium exactly, whether it comes up as sda, sdb or anything else.
#    That value is pinned by --gpt_disk_guid in br2ext/external.mk, which
#    checks the built image really carries it.
#
# GRUB names an El Torito medium cd0, cd1 and so on; anything else is a disk.
if regexp '^cd[0-9]*$' "${root}"; then
	set aosroot="/dev/sr0"
else
	set aosroot="PARTUUID=__ROOT_PARTUUID__"
fi

# rootwait is what makes USB work at all: USB enumeration finishes well
# after the kernel first looks for the root device, and without it the boot
# panics with "Unable to mount root fs" before the stick has appeared. It
# costs nothing on media that are ready immediately.
#
# Kernel messages go to both consoles. /dev/console -- and therefore the
# login prompt -- follows the LAST console= given, so tty1 is deliberately
# last: a machine with a monitor gets its login on screen, while the boot
# log is still visible to anyone watching the serial line.
#
# The initrd is CPU microcode only, not an initramfs (see post-build.sh).
menuentry "AOS (live)" {
	linux __KERNEL_PATH__ root=${aosroot} rootfstype=iso9660 ro rootwait console=ttyS0,115200 console=tty1
	initrd /boot/microcode.img
}

# For headless machines: login on the serial line instead.
menuentry "AOS (live, serial console)" {
	linux __KERNEL_PATH__ root=${aosroot} rootfstype=iso9660 ro rootwait console=ttyS0,115200
	initrd /boot/microcode.img
}

# If the detection above ever picks wrong, these say it outright.
menuentry "AOS (live, force optical /dev/sr0)" {
	linux __KERNEL_PATH__ root=/dev/sr0 rootfstype=iso9660 ro rootwait console=ttyS0,115200 console=tty1
	initrd /boot/microcode.img
}

menuentry "AOS (live, force USB/disk)" {
	linux __KERNEL_PATH__ root=PARTUUID=__ROOT_PARTUUID__ rootfstype=iso9660 ro rootwait console=ttyS0,115200 console=tty1
	initrd /boot/microcode.img
}
