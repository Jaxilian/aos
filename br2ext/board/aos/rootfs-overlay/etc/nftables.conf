#!/usr/bin/nft -f
# AOS firewall: nothing comes in that this machine did not ask for.
#
# Only the input hook. No forward chain, so nspawn containers and anything
# else networkd masquerades (its own "io.systemd.nat" table) keep working;
# no output chain, nothing here is a NAT box. Loaded by nftables.service at
# boot and on "systemctl reload nftables"; the two lines at the top make a
# reload replace this table and leave every other table alone.
#
# Enabling a service that listens (sshd is the one in the image; it is
# enabled only when the build carried an SSH key) means adding its port
# here, or it is reachable from this machine only.
table inet filter
destroy table inet filter

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		# Replies to what we sent; anything conntrack cannot place, dropped.
		ct state vmap { established : accept, related : accept, invalid : drop }
		iif lo accept

		# ICMP and ICMPv6, including the neighbour discovery and router
		# advertisements IPv6 cannot work without.
		meta l4proto { icmp, ipv6-icmp } accept

		# DHCP answers. The v4 offer is broadcast to port 68, the v6 reply
		# is to link-local port 546; neither matches a conntrack entry.
		udp dport { 68, 546 } accept

		# SSH.
		tcp dport 22 accept
	}
}
