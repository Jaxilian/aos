# The system locale. systemd reads this file at boot and puts LANG into the
# environment of every service it starts, so this is what actually selects
# the locale that BR2_GENERATE_LOCALE compiled into the image.
#
# It matters beyond text: foot refuses to start unless LC_CTYPE names a
# UTF-8 charset, and "C" -- the default when this file is absent -- does
# not. Anything reading a filename with a non-ASCII byte in it is in the
# same position.
#
# Only en_US.UTF-8 is generated. Adding another locale means adding it to
# BR2_GENERATE_LOCALE as well, or localectl will not find it.
LANG=en_US.UTF-8
