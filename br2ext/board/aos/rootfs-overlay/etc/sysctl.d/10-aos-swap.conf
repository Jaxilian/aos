# Tuned for zram as the primary swap device.
#
# swappiness: the default of 60 assumes swapping is far more expensive than
# dropping page cache, which was true of spinning disks and is not true of
# zram. 100 treats the two as equal cost, so the kernel compresses cold
# anonymous pages instead of throwing away useful cache.
vm.swappiness = 100
# page-cluster: swap read-ahead in pages, as a power of two. Read-ahead only
# helps a device with seek cost; on zram it just decompresses pages nobody
# asked for. 0 disables it.
vm.page-cluster = 0
