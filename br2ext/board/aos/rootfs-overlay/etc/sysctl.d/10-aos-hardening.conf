# What the kernel lets an ordinary program see and do. Each line closes
# one thing a program on a desktop has no use for and an attacker does
# (docs/security-model.md). systemd's 50-default.conf already protects
# symlinks, hardlinks, fifos and regular files in sticky directories.

# The kernel log names addresses, drivers and hardware; root reads it.
kernel.dmesg_restrict = 1
# Kernel pointers in /proc and sysfs read as zero for everyone.
kernel.kptr_restrict = 2
# A process may ptrace only its own descendants: a program cannot read
# another's memory for passwords or session tokens (Yama).
kernel.yama.ptrace_scope = 1
# Loading BPF programs is root's; the JIT's output is hardened against
# being reused as a payload.
kernel.unprivileged_bpf_disabled = 1
-net.core.bpf_jit_harden = 2
# Performance counters, a side channel, are root's.
kernel.perf_event_paranoid = 3
# No replacing the running kernel from userspace. The leading - on this and
# the JIT line: a kernel without the option has no such key, and the file
# must still apply.
-kernel.kexec_load_disabled = 1
# Magic SysRq: only the sync and reboot keys, as systemd ships it.
kernel.sysrq = 16

# A desktop is not a router: no ICMP redirects taken or sent, no source
# routing, and the SYN cookies that keep a flood from filling the backlog.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
