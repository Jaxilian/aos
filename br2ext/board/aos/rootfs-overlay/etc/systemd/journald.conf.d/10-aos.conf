# Cap the persistent journal. The default is 10% of /var up to 4 GB, which
# is a lot of a small root filesystem.
#
# Storage=persistent: the journal is written to /var/log/journal from the
# first line. /var is mounted by /usr/lib/aos/init before systemd starts,
# so the directory is there; with the default "auto" journald writes to
# /run first and systemd-journal-flush.service copies everything across
# once the file systems are up -- 4.5 s on the G14's USB stick, inside
# sysinit.target, so the desktop waited for it (the report of
# 2026-10-05). The live ISO has no writable /var and falls back to /run
# by itself.
[Journal]
SystemMaxUse=512M
Storage=persistent
