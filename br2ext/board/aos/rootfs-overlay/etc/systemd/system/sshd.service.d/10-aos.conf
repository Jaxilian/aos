# Replace Buildroot's "ssh-keygen -A" with one that also copes with the
# read-only /etc of the live ISO (see the script). ExecStartPre= on its own
# clears the inherited entry before adding ours.
#
# Not ordered after network-online.target: sshd listens on the wildcard
# address, so it needs no interface up, and wanting that target made every
# boot wait for the network (1m27s on a laptop with no Wi-Fi configured).
[Service]
ExecStartPre=
ExecStartPre=/usr/lib/aos/sshd-keygen
Restart=on-failure
RestartSec=5s
# Stopping sshd stops the listener, not the sessions: with the default
# KillMode systemd waits for every process in the cgroup, and a
# connection whose peer has gone quiet held a shutdown for the full 90 s
# ("A stop job is running for OpenSSH server daemon", seen on the G14).
# Sessions end with their own scopes. And a bound, in case.
KillMode=process
TimeoutStopSec=10s
