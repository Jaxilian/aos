# Bound the wait for the network. Upstream waits for *every* link to be
# routable, up to two minutes: on a laptop with no Wi-Fi configured yet that
# is 1m27s of black screen before the desktop (systemd-analyze on the G14).
# Nothing in the image pulls network-online.target in any more (sshd used
# to), but whatever does later gets "any one link is up, or 10 s".
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=10
