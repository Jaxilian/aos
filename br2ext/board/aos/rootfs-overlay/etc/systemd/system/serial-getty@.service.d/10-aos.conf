# Only run a getty on a serial port that exists.
#
# The kernel command line says console=ttyS0 so QEMU's boot tests can log
# in over the serial line, and the getty generator then starts
# serial-getty@ttyS0 on every machine. A PC with no serial port still has
# a /dev/ttyS0 -- the 8250 driver registers its legacy ports blind -- so
# agetty opened it, failed with "failed to get terminal attributes:
# Input/output error", and was restarted every 10 s, forever, filling the
# journal. The port's sysfs "type" is 0 for a port the driver never found;
# a real 16550 is 4. A tty with no "type" attribute (ttyUSB, hvc) passes.
[Service]
ExecCondition=/bin/sh -c 'test "$$(cat /sys/class/tty/%I/type 2>/dev/null)" != 0'
