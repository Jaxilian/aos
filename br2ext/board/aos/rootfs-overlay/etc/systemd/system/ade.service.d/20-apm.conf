# What apm installs, for the desktop. ade.service is a system unit, so it
# reads neither /etc/profile.d nor environment.d; the two variables the
# shell and everything it spawns need are set here. The values are literal
# because a unit's Environment= does not expand a PATH it never had.
[Service]
Environment=PATH=/opt/apm/bin:/usr/bin
Environment=XDG_DATA_DIRS=/opt/apm/exports/share:/usr/local/share:/usr/share
