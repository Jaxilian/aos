# What happens when the desktop dies. Restart=always is the unit's own;
# this bounds it: four starts in two minutes, then the unit fails and
# ade-failed.service puts a login prompt with an explanation on tty1
# rather than leaving it black. Each bad end is noted in /run/ade/crash
# (the runtime directory is the session user's), which the next
# compositor reads and tells the shell about; a clean stop clears it.
[Unit]
StartLimitIntervalSec=120
StartLimitBurst=4
OnFailure=ade-failed.service

[Service]
RestartSec=2
RuntimeDirectory=ade
RuntimeDirectoryPreserve=yes
ExecStopPost=/bin/sh -c 'if [ "$SERVICE_RESULT" = success ]; then rm -f /run/ade/crash; else echo "$SERVICE_RESULT ($EXIT_CODE $EXIT_STATUS)" >> /run/ade/crash; fi'
