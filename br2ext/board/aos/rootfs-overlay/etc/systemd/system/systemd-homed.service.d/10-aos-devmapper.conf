# libdevmapper in this image has no udev sync (Buildroot builds lvm2
# before systemd, whose libudev it would need), so when a home is opened
# the library makes the /dev/mapper node itself. The unit's sandbox
# refused that mknod -- no CAP_MKNOD in the bounding set, no "m" on the
# block devices -- and every home failed with "mknod for home-NAME
# failed: Operation not permitted" (2026-10-07). The two lines append to
# upstream's.
[Service]
CapabilityBoundingSet=CAP_MKNOD
DeviceAllow=block-* rwm
