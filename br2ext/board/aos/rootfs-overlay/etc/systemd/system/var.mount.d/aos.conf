# Buildroot's var.mount puts a tmpfs on /var so that the read-only live ISO
# has somewhere to write. An installed system has a real, writable /var and
# must keep it, so the tmpfs is conditional on the root being read-only.
#
# The root of an installed system is also read-only for a moment at boot,
# until systemd-remount-fs has applied /etc/fstab; the condition must be
# judged after that, or the tmpfs would land on an installed system too.
[Unit]
After=systemd-remount-fs.service
ConditionPathIsReadWrite=!/
