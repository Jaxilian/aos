# greetd(5): the login daemon. The greeter is ade-greeter on its own
# compositor (usr/lib/aos/session --greeter), as the greeter account.
#
# This copy is the core's: the live medium, where the session account
# admin logs in by itself (initial_session). aos-install writes the one
# an installed machine runs with into the /etc overlay: no initial
# session for an owned machine (the greeter asks), the setup account's
# first-boot session for a machine installed for someone else, and the
# live form again for a demo install.
[terminal]
vt = 1

[default_session]
command = "/usr/lib/aos/session --greeter"
user = "greeter"

[initial_session]
command = "/usr/lib/aos/session"
user = "admin"
