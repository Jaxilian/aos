# Console keyboard layout.
#
# Change KEYMAP and reboot, or apply it immediately with:
#     loadkeys sv-latin1
#
# List everything available:
#     ls /usr/share/keymaps/i386/*/
#
# Common ones: us, uk, sv-latin1 (Swedish), no-latin1 (Norwegian),
# dk-latin1 (Danish), fi (Finnish), de-latin1 (German), fr (French),
# es (Spanish), it (Italian), dvorak, colemak.
#
# AOS ships "us" as the default because it has to ship something. This is
# not a recommendation -- set it to whatever your keyboard actually is.
KEYMAP=us
