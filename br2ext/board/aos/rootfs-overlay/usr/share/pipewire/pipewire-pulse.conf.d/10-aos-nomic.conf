# The same for the PulseAudio protocol (Firefox, Steam, Discord talk to
# this): a second socket, pulse/native-nomic, whose clients the server
# tags "nomic" on their PipeWire connection. aos-sandbox binds it over
# pulse/native for a program without the Microphone permission.
pulse.properties = {
    server.address = [
        "unix:native"
        { address = "unix:native-nomic" client.access = "nomic" }
    ]
}
