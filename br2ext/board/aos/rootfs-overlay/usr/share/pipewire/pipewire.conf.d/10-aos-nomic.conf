# A second socket for programs that may not use the microphone. A client
# on pipewire-0-nomic is tagged access "nomic"; WirePlumber gives it the
# ordinary permissions (20-aos-nomic.conf) but refuses to link any
# capture stream of its (scripts/linking/find-nomic-target.lua), so it
# plays sound and records nothing. aos-sandbox binds this socket over
# pipewire-0 for a program without the Microphone permission.
#
# Naming the sockets turns the access module's deprecated legacy mode
# off: pipewire-0 is "default" (every permission, as before) and the
# manager socket "unrestricted", which is what the legacy mode gave.
module.protocol-native.args = {
    sockets = [
        { name = "pipewire-0" }
        { name = "pipewire-0-manager" }
        { name = "pipewire-0-nomic" }
    ]
}
module.access.args = {
    access.socket = {
        pipewire-0 = "default"
        pipewire-0-manager = "unrestricted"
        pipewire-0-nomic = "nomic"
    }
}
