# Clients tagged "nomic" (pipewire.conf.d/10-aos-nomic.conf): the usual
# permissions of a sandboxed client, and a linking hook that turns their
# capture streams away.
access.rules = [
  {
    matches = [ { access = "nomic" } ]
    actions = { update-props = { default_permissions = "rx" } }
  }
]

wireplumber.components = [
  {
    name = linking/find-nomic-target.lua, type = script/lua
    provides = hooks.linking.target.find-nomic
  }
]

wireplumber.profiles = {
  main = {
    hooks.linking.target.find-nomic = required
  }
}
