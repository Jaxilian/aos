# The device monitors the image has no SPA plugin for. PipeWire here is
# built without its V4L2 and libcamera plugins (no camera stack), and
# with the monitors left on WirePlumber reports each missing plugin at
# every session start. Off, they cost nothing and log nothing. Turn one
# back on here when its plugin joins the image. (The BlueZ monitor stays
# on: PipeWire's Bluetooth backend is built, for headsets over BlueZ.)
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
