# The device monitors the image has no SPA plugin for. PipeWire here is
# built without its Bluetooth, V4L2 and libcamera plugins (no BlueZ on
# the image, no camera stack), and with the monitors left on WirePlumber
# reports each missing plugin at every session start and fails to make
# its BLE MIDI node ("can't create node: No such file or directory").
# Off, they cost nothing and log nothing. Turn one back on here when its
# plugin joins the image.
wireplumber.profiles = {
  main = {
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
