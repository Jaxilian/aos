# What the desktop keeps across logins: a session its script gave up on
# (usr/lib/aos/session) leaves its crash lines here, named after the
# account, for that account's next login. Shared and sticky like /tmp:
# an account writes its own file and nobody else's. /run/aos itself is
# also where the initramfs leaves the live medium (live/).
d /run/aos 0755 root root -
d /run/aos/session 1777 root root -
