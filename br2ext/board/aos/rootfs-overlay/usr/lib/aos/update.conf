# Where aos-update looks for a release: SHA256SUMS, SHA256SUMS.minisig and
# the root image they name, signed with the key in /opt/apm/etc/keys/trusted.
URL=https://github.com/Jaxilian/apm-recipes/releases/download/index
# The channel: the URL above as written is edge (every release as it is
# published); CHANNEL=stable takes the releases promoted to stable after a
# while on edge (release.sh --promote stable). /etc/aos/update.conf, when
# it exists, replaces this file.
#CHANNEL=stable
