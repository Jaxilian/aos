# Embedded into the GRUB core image itself, for both the BIOS and the EFI
# builds. Its only job is to locate the medium GRUB was booted from and hand
# over to the real menu in /boot/grub/grub.cfg.
#
# It must not hardcode a device. "set root=(cd0)" works when the image is
# burned to a disc, but the same image written to a USB stick appears as a
# hard disk, GRUB then fails to find its configuration, and the user is
# dropped at a grub> prompt with no menu. Searching for a file that only
# exists on our own medium works in every case.
search --no-floppy --set=root --file /boot/grub/grub.cfg
set prefix=($root)/boot/grub
